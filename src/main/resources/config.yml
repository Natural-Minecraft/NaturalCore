# ==========================================
#      NATURAL CORE - CONFIGURATION
# ==========================================
config-version: 2.2.2

# Catatan: Konfigurasi sekarang terpisah:
# - config.yml     : Pengaturan utama (ini)
# - messages.yml   : Semua pesan plugin
# - chatemojis.yml : Konfigurasi emoji chat

# --- PREFIX SETTINGS ---
# Gunakan format Hex &#RRGGBB untuk warna modern
prefix:
  admin: "&#00AAFF&lNatural&#55FF55&lCore &8» &f"
  general: "&#00AAFF&lNatural&#55FF55&lSMP &8» &f"
  moderation: "&#00AAFF&lNatural&#55FF55&lMod &8» &f"
  economy: "&#00AAFF&lNatural&#55FF55&lEco &8» &f"
  spawn: "&#00AAFF&lNatural&#55FF55&lSpawn &8» &f"
  warp: "&#00AAFF&lNatural&#55FF55&lWarp &8» &f"
  home: "&#00AAFF&lNatural&#55FF55&lHome &8» &f"
  teleport: "&#00AAFF&lNatural&#55FF55&lTeleport &8» &f"
  player: "&#00AAFF&lNatural&#55FF55&lSMP &8» &f"

# ==========================================
#          NATURAL LAGG SETTINGS
# ==========================================
lagg:
  enabled: true

  # Scheduled Auto-Removal (ClearLag-style)
  auto-removal:
    enabled: true
    interval: 300 # Detik (5 menit default)
    warning-times: [60, 30, 10, 5, 3, 2, 1] # Detik sebelum clear, kirim warning

  # Mob Stacking / Merging
  merging:
    enabled: true
    threshold: 5
    radius: 2.0
    # Mob yang TIDAK digabungkan
    blacklist:
      - VILLAGER
      - IRON_GOLEM
      - WITHER
      - ENDER_DRAGON
      - ELDER_GUARDIAN

  # Item Cleanup Filter
  cleanup:
    default-duration: 10
    # Item yang TIDAK dihapus saat /clean ground
    item-whitelist:
      - DIAMOND
      - NETHERITE_INGOT
      - NETHERITE_SCRAP
      - ENCHANTED_BOOK
      - ELYTRA
      - TOTEM_OF_UNDYING
      - BEACON
      - NETHER_STAR
      - SHULKER_BOX
    # Hapus juga item death drops? (false = lindungi)
    remove-death-drops: false

  # Per-chunk Entity Limiter
  chunk-limiter:
    enabled: true
    max-entities-per-chunk: 50
    check-interval: 60 # Detik

  # Low TPS Optimizer
  optimizer:
    tps-threshold: 10.0
    check-interval: 30

  # Worlds yang dikecualikan
  excluded-worlds:
    - "dungeon"
    - "dungeon_forest_cave"
    - "world_the_end"

# ==========================================
#           CHAT & SOCIAL SYSTEM
# ==========================================
chat:
  enabled: true

  # Format Chat Global
  # %displayname% = Prefix + Nama + Suffix (dari LuckPerms)
  # %player%      = Nama Asli
  format: "%displayname% &8» &f{message}"

  # Format Private Message (MSG)
  msg-format-sender: "&8[&bme &8→ &b{receiver}&8] &f{message}"
  msg-format-receiver: "&8[&b{sender} &8→ &bme&8] &f{message}"

  allow-color: true
  
  # Sistem Mention
  mention:
    enabled: true
    sound: "BLOCK_NOTE_BLOCK_PLING"
    volume: 1.0
    pitch: 2.0
    color: "&e@" # Warna highlight nama yang dimention

# TIPS settings moved to text/tips.yml

# ==========================================
#              AFK SETTINGS
# ==========================================
afk:
  enabled: true
  timeout: 300 # Detik (5 Menit)
  display-text: "&b💤 &7Sedang Bermimpi... &b💤"
  title:
    enabled: true
    title: "<gradient:#808080:#D3D3D3>YOU ARE NOW AFK</gradient>"
    subtitle: "&7Move to resume..."

# ==========================================
#          PENGATURAN EKONOMI
# ==========================================
economy:
  vault:
    enabled: true
    symbol: "Rp"
    aliases: ["rupiah", "rp", "money", "duit"]
  coins-engine:
    enabled: true
    currency-id: "naturalcoin"
    symbol: "NC"
    aliases: ["naturalcoin", "nc", "coin"]

# ==========================================
#            PENGATURAN HOME
# ==========================================
home:
  # Folder penyimpanan: plugins/NaturalCore/homes/
  # Format permission: naturalsmp.home.limit.<group>
  limits:
    default: 3
    midi: 5
    vip: 10
    mvp: 30
    nature: 50
    admin: 100

# ==========================================
#             SPAWN SETTINGS
# ==========================================
spawn:
  allowed-join-worlds:
    - "spawn"
    - "world"
    - "world_nether"
    - "world_the_end"
    - "Resources"
#              RTP SETTINGS
# ==========================================
rtp:
  survival-world: "world"
  resource-world: "resource"

settings:
  restart-alert-time: 10
  broadcast-cooldown: 5

# ==========================================
#          CORE DATABASE (MySQL)
# ==========================================
# Centralized storage for maintenance, homes, warps, etc.
database:
  enabled: true
  host: localhost
  port: 3306
  database: "nsmp_naturalcore"
  username: "nsmp_NaturalCore"
  password: ""

# ==========================================
#          RANK PRICE DATABASE
# ==========================================
# Fetch rank prices from MySQL for the /ranks GUI
rank_price_database:
  enabled: true
  host: localhost
  port: 3306
  database: "nsmp_website"
  username: "nsmp_website"
  password: ""
  table: "products"
  # Uses existing 'products' table from store.naturalsmp.id
  # Filters by type='rank', id format: "rank-vip", "rank-mvp", etc.

# ==========================================
#          FIRST JOIN KIT
# ==========================================
first-join-kit:
  items:
    - "WOODEN_SWORD:1"
    - "WOODEN_PICKAXE:1"
    - "WOODEN_AXE:1"
    - "WOODEN_SHOVEL:1"
    - "COOKED_BEEF:16"
    - "GOLDEN_SHOVEL:1"
  armor:
    helmet: "LEATHER_HELMET"
    chestplate: "LEATHER_CHESTPLATE"
    leggings: "LEATHER_LEGGINGS"
    boots: "LEATHER_BOOTS"