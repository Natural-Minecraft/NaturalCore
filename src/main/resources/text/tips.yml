# ==========================================
# NATURAL CORE - TIPS CONFIGURATION
# ==========================================
# Semua setting bisa diubah tanpa restart plugin.
# Gunakan /nacore reload untuk menerapkan perubahan.

settings:
  enabled: true
  interval: 300         # Detik antar tips (default: 300 = 5 menit)
  duration: 10          # Detik tips ditampilkan (default: 10)

  # Sound effect saat tips muncul
  sound:
    enabled: true
    name: "BLOCK_NOTE_BLOCK_HAT"
    volume: 0.4
    pitch: 2.0

  # Marquee (scrolling) untuk tips yang kepanjangan
  marquee:
    max-width: 50        # Lebar maksimal sebelum scrolling aktif
    scroll-speed: 4      # Ticks per karakter scroll (makin kecil = makin cepat)
    pause-duration: 4.0  # Detik jeda membaca sebelum/sesudah scroll

    # Typing sound effect saat scrolling
    typing-sound:
      enabled: true
      name: "BLOCK_NOTE_BLOCK_HAT"
      volume: 0.15
      pitch: 1.8

tips:
  - "&7Ketik &f/rtp &7untuk cari lahan survival!"
  - "&7Buat &fClan &7bersama temanmu!"
  - "&7Vote harian dengan &f/vote&7!"
  - "&7Rank &bMVP &7= akses &f/fly &7survival!"
  - "&7Cek statistikmu di &f/profile&7!"
  - "&7Butuh bantuan &eSlimefun&7? Ketik &f/sf guide&7!"
  - "&7Banyak item &bSlimefun &7baru yang bisa kamu buat!"
  - "&7Gunakan &eMulti-block &7untuk mesin Slimefun!"
