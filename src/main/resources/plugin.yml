name: NaturalCore
version: ${project.version}
main: id.naturalsmp.naturalcore.NaturalCore
api-version: 1.21
author: NaturalSMP
description: Core plugin untuk NaturalSMP Server
depend: [Vault, DecentHolograms]
softdepend: [PlaceholderAPI, CoinsEngine, AuraSkills]

# ==========================================
# DAFTAR COMMANDS
# ==========================================
commands:
  # --- CORE ---
  nacore:
    description: Main command plugin
    permission: naturalsmp.admin
  kickall:
    description: Kick seluruh player
    permission: naturalcs.kickall
  restartalert:
    description: Alert restart
    aliases: [ra]
    permission: naturalcs.restartalert
  ranks:
    description: Lihat daftar rank premium
    aliases: [rank, rk]
  restart:
    description: Restart server dengan alert premium
    permission: naturalcs.restartalert
  restartcancel:
    description: Batalkan alert restart
    aliases: [rc]
    permission: naturalcs.restartalert
  maintenance:
    description: Mode maintenance
    aliases: [mt]
    permission: naturalsmp.maintenance.command
  bc:
    description: Broadcast
    aliases: [broadcast]
    permission: naturalcs.broadcast
  tp:
    description: Teleport admin
    permission: naturalsmp.tp
  tphere:
    description: Tarik player
    permission: naturalsmp.tphere

  endersee:
    description: Intip enderchest player lain
    aliases: [ecsee]
    permission: naturalsmp.endersee

  topupnotification:
    description: Trigger TopUp success GUI and notification
    permission: naturalsmp.admin

  # --- MESSAGING ---
  msg:
    description: Kirim pesan pribadi
    aliases: [tell, w, whisper]
  reply:
    description: Balas pesan terakhir
    aliases: [r]

  # --- UTILITIES (WORLD) ---
  day:
    description: Ubah waktu ke siang
    permission: naturalsmp.time
  night:
    description: Ubah waktu ke malam
    permission: naturalsmp.time
  sun:
    description: Ubah cuaca cerah
    permission: naturalsmp.time
  rain:
    description: Ubah cuaca hujan
    permission: naturalsmp.time

  # --- PERKS ---
  hat:
    description: Pakai item di kepala
    permission: naturalsmp.hat
  repair:
    description: Perbaiki item
    aliases: [fix]
    permission: naturalsmp.repair
  nick:
    description: Ganti nickname
    aliases: [nickname]
    permission: naturalsmp.nick

  # --- ECONOMY ---
  givebal:
    description: Give balance
    permission: naturalcs.givebalance
  setbal:
    description: Set saldo
    permission: naturalsmp.economy.admin
  takebal:
    description: Tarik saldo
    permission: naturalsmp.economy.admin
  baltop:
    description: Top balance
  bal:
    description: Cek saldo
    aliases: [balance, money]
  pay:
    description: Kirim uang

  # --- ESSENTIALS ---
  gamemode:
    description: Gamemode
    aliases: [gm]
    permission: naturalsmp.gamemode
  creative:
    description: Mode Creative
    aliases: [gmc, creativemode]
    permission: naturalsmp.gamemode.creative
  survival:
    description: Mode Survival
    aliases: [gms, survivalmode]
    permission: naturalsmp.gamemode.survival
  adventure:
    description: Mode Adventure
    aliases: [gma, adventuremode]
    permission: naturalsmp.gamemode.adventure
  spectator:
    description: Mode Spectator
    aliases: [gmsp, spec]
    permission: naturalsmp.gamemode.spectator

  fly:
    description: Terbang
    permission: naturalsmp.fly
  heal:
    description: Heal
    permission: naturalsmp.heal
  feed:
    description: Feed
    permission: naturalsmp.feed
  trash:
    description: Sampah
  craft:
    description: Crafting
    aliases: [wb]
    permission: naturalsmp.craft
  anvil:
    description: Buka virtual anvil
    aliases: [ av ]
    permission: naturalsmp.anvil
  invsee:
    description: Cek tas
    permission: naturalsmp.invsee
  enderchest:
    description: Buka enderchest sendiri
    aliases: [ec]
    permission: naturalsmp.enderchest

  # --- MODERATION ---
  god:
    description: God mode
    permission: naturalsmp.god
  vanish:
    description: Vanish
    aliases: [v]
    permission: naturalsmp.vanish
  whois:
    description: Info player
    permission: naturalsmp.whois

  # --- SERVER INFO ---
  list:
    description: List player online
    aliases: [who, plist, online, playerlist]
    permission: naturalsmp.list
  lag:
    description: Cek performa server
    aliases: [tps, mem, memory, uptime]
    permission: naturalsmp.lag
  info:
    description: Info server
    aliases: [about, news, ifo, inform]
    permission: naturalsmp.info
  help:
    description: NaturalCore Help
    permission: naturalsmp.help

  # --- ITEM EDITOR ---
  give:
    description: Give item
    aliases: [i]
    permission: naturalsmp.give
  itemname:
    description: Rename item
    aliases: [iname, name]
    permission: naturalsmp.itemname
  lore:
    description: Edit item lore
    aliases: [ilore, itemlore]
    permission: naturalsmp.lore

  lore:
    description: Edit item lore
    aliases: [ilore, itemlore]
    permission: naturalsmp.lore

  # --- FUN ---
  fireball:
    description: Tembakkan fireball
    permission: naturalsmp.fun.fireball
  firework:
    description: Luncurkan kembang api
    permission: naturalsmp.fun.firework
  jumpto:
    description: Teleport ke lokasi yang dilihat
    aliases: [j]
    permission: naturalsmp.jumpto

  # --- CHAT & BROADCAST ---
  bcworld:
    description: Broadcast ke world saat ini
    aliases: [broadcastworld]
    permission: naturalsmp.broadcast.world
  shout:
    description: Kirim pesan shout global
    permission: naturalsmp.shout
  sudo:
    description: Paksa player menjalankan command/chat
    permission: naturalsmp.sudo

  # --- MODERATION (MODERN) ---
  freeze:
    description: Bekukan player
    aliases: [ice]
    permission: naturalsmp.freeze
  kill:
    description: Bunuh player instan
    permission: naturalsmp.kill

  # --- WARP ---
  warp:
    description: Ke warp
  warps:
    description: Menu warp
  setwarp:
    description: Set warp
    permission: naturalsmp.admin
  delwarp:
    description: Hapus warp
    permission: naturalsmp.admin
  setwarpicon:
    description: Icon warp
    permission: naturalsmp.admin

  # --- SPAWN ---
  spawn:
    description: Ke spawn
    permission: naturalsmp.spawn
  setspawn:
    description: Set spawn
    permission: naturalsmp.admin

  # --- HOME ---
  sethome:
    description: Set home
    permission: naturalsmp.home.use
  delhome:
    description: Hapus home
    permission: naturalsmp.home.use
  home:
    description: Ke home
    permission: naturalsmp.home.use
  homes:
    description: List home
    permission: naturalsmp.home.use

  # --- FUN & RTP ---

  resource:
    description: RTP Resource
    aliases: [rsc]
    permission: naturalsmp.resource
  survival:
    description: RTP Survival
    aliases: [rtp]

  # --- TPA ---
  tpa:
    description: TPA Request
  tpahere:
    description: TPA Here
  tpaccept:
    description: Accept
  tpdeny:
    description: Deny

  # --- EMOJI ---
  emoji:
    description: Lihat daftar emoji yang tersedia
    aliases: [emojis, emoticon]
    permission: naturalsmp.emoji.use

  # --- SEASONS ---
  season:
    description: Season and temperature management
    permission: naturalsmp.season.admin

  # --- BANNERS ---
  banner:
    description: Interactive banners management (Interactive Board)
    permission: naturalsmp.admin.banner

  # --- PROFILE ---
  tags:
    description: Koleksi Tag Chat
  tier:
    description: Sistem Ranking Natural Tier
  profile:
    description: Buka menu profil player
    aliases: [p, stats]

  # --- v1.7 COMMANDS ---
  chatcolor:
    description: Buka menu warna chat
    aliases: [color, ccolor]
    permission: naturalsmp.chat.color
  clean:
    description: Bersihkan inventory (kecuali armor)
    aliases: [clear, ci]
    permission: naturalsmp.clean
  back:
    description: Kembali ke lokasi kematian/tpa
    permission: naturalsmp.back
  otp:
    description: Teleport ke player offline
    aliases: [offlinetp]
    permission: naturalsmp.otp

  chatview:
    description: Internal command to view chat snapshots
    permission: naturalsmp.chat.view

  # --- v1.8.5 UTILITIES ---
  menu:
    description: Buka menu utama NaturalSMP
  ptime:
    description: Atur waktu personal player
    permission: naturalsmp.ptime
  pweather:
    description: Atur cuaca personal player
    permission: naturalsmp.pweather
  start:
    description: Menu awal pemilihan dunia (Survival/Resource/Dungeon)

permissions:
  naturalsmp.admin:
    default: op
  naturalcs.kickall:
    default: op
  naturalcs.restartalert:
    default: op
  naturalcs.broadcast:
    default: op
  naturalsmp.season.admin:
    description: Control seasons and temperature
    default: op
  naturalsmp.admin.banner:
    description: Create and manage interactive banners
    default: op
  naturalsmp.maintenance.bypass:
    description: Bypass maintenance mode
    default: op
  naturalsmp.maintenance.command:
    description: Toggle maintenance mode
    default: op
  naturalsmp.home.limit.*:
    description: Izin untuk semua jenis limit home
    children:
      naturalsmp.home.limit.default: true
      naturalsmp.home.limit.unlimited: true
  naturalsmp.home.limit.unlimited:
    description: Izin untuk membuat home tanpa batas
    default: op

  # --- v1.7 Permissions ---
  naturalsmp.clean:
    description: Access to /clean
    default: op
  naturalsmp.back:
    description: Access to /back
    default: op
  naturalsmp.otp:
    description: Access to /otp
    default: op
  naturalsmp.trash:
    description: Access to /trash
    default: true
  naturalsmp.chat.view:
    description: Access to chat item/inv preview
    default: true
  
  # Chat Color Ranks
  naturalsmp.chat.color:
    description: Access to basic ChatColor
    default: true
  naturalsmp.color.vip:
    description: Access to VIP colors
    default: op
  naturalsmp.color.mvp:
    description: Access to MVP colors
    default: op
  naturalsmp.color.midi:
    description: Access to Midi colors
    default: op
  naturalsmp.color.nature:
    description: Access to ALL colors + fonts + styles
    default: op