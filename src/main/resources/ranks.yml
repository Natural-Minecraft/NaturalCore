    - voicechat.listen
    - voicechat.groups

  midi:
    display: "&dMidi"
    prefix: " "
    weight: 100
    inherit: member
    permissions:
      - naturalsmp.enderchest
      - naturalsmp.back
      - naturalsmp.emoji.unlimited
      - naturalsmp.color.midi
      - naturalsmp.home.limit.midi
      - redprotect.limits.blocks.25000
      - redprotect.limits.claim.10

  vip:
    display: "&aVIP"
    prefix: " "
    weight: 200
    inherit: midi
    permissions:
      - naturalsmp.hat
      - naturalsmp.trash
      - naturalsmp.resource
      - naturalsmp.nick
      - naturalsmp.color.vip
      - naturalsmp.home.limit.vip
      - redprotect.limits.blocks.50000
      - redprotect.limits.claim.20

  mvp:
    display: "&bMVP"
    prefix: " "
    weight: 300
    inherit: vip
    permissions:
      - naturalsmp.fly
      - naturalsmp.craft
      - naturalsmp.anvil
      - naturalsmp.ptime
      - naturalsmp.pweather
      - naturalsmp.color.mvp
      - naturalsmp.home.limit.mvp
      - redprotect.limits.blocks.150000
      - redprotect.limits.claim.40

  tiktok:
    display: "&aVIP"
    prefix: " "
    weight: 321
    inherit: mvp
    permissions:
      - naturalsmp.priority
      - naturalsmp.tiktok

  youtube:
    display: "&aVIP"
    prefix: " "
    weight: 321
    inherit: mvp
    permissions:
      - naturalsmp.priority
      - naturalsmp.youtube

  helper:
    display: "&bHelper"
    prefix: " "
    weight: 350
    inherit: mvp
    permissions:
      - naturalsmp.helper.kick
      - naturalsmp.helper.mute
      - naturalsmp.helper.tempmute
      - naturalsmp.helper.unmute
      - naturalsmp.helper.warn

  nature:
    display: "&eNature"
    prefix: " "
    weight: 400
    inherit: mvp
    permissions:
      - naturalsmp.priority
      - naturalsmp.temperature.immune
      - naturalsmp.color.nature
      - naturalsmp.home.limit.nature
      - redprotect.limits.blocks.500000
      - redprotect.limits.claim.80